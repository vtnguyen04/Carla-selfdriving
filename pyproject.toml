[build-system]
requires = ["flit_core>=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "car_dreamer"
authors = [
    {name = "Vo Thanh Nguyen", email = "nguyenvothanh04@gmail.com"},
]
dynamic = ["version", "description"]
dependencies = [
    "carla==0.9.15",
    "cloudpickle==3.0.0",
    "crafter==1.8.3",
    "dm-control==1.0.18",
    "einops>=0.8.1",
    "ffmpeg==1.4",
    "flask==3.0.3",
    "gym==0.12.5",
    "imageio==2.34.1",
    "jax[cuda12-pip]==0.4.34",
    "jaxlib==0.4.34",
    "loguru>=0.7.3",
    "matplotlib==3.8.4",
    "moviepy==1.0.3",
    "msgpack>=1.1.2",
    "networkx==3.1",
    "numpy==1.24.3",
    "opencv-python>=4.9,<5.0",
    "optax==0.2.2",
    "pyyaml==6.0.1",
    "pyzmq>=27.1.0",
    "ruamel-yaml==0.18.6",
    "scikit-image==0.23.2",
    "shapely==1.8.4",
    "tabulate==0.9.0",
    "tensorflow-probability==0.21.0",
    "tensorflow[and-cuda]==2.13.0",
    "typing-extensions==4.5.0",
    "wandb==0.16.6",
]
requires-python = "==3.10.*"
[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101"]
