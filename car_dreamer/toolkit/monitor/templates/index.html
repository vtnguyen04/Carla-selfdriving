<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CarDreamer Cyber Dashboard</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Rajdhani', sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1a2e 50%, #16213e 100%);
            color: #e0e0e0;
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0, 255, 255, 0.03) 2px, rgba(0, 255, 255, 0.03) 4px),
                repeating-linear-gradient(90deg, transparent, transparent 2px, rgba(0, 255, 255, 0.03) 2px, rgba(0, 255, 255, 0.03) 4px);
            pointer-events: none;
            z-index: 1;
        }

        .container {
            display: flex;
            flex-direction: column;
            padding: 30px;
            min-height: 100vh;
            position: relative;
            z-index: 2;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            position: relative;
        }

        .header h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 48px;
            font-weight: 900;
            background: linear-gradient(90deg, #00f5ff, #00d4ff, #00f5ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px rgba(0, 245, 255, 0.5);
            letter-spacing: 4px;
            animation: glow 2s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from { filter: drop-shadow(0 0 10px rgba(0, 245, 255, 0.5)); }
            to { filter: drop-shadow(0 0 20px rgba(0, 245, 255, 0.8)); }
        }

        .status-bar {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: rgba(0, 245, 255, 0.1);
            border: 1px solid rgba(0, 245, 255, 0.3);
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #00f5ff;
            box-shadow: 0 0 10px #00f5ff;
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(0.8); }
        }

        .section {
            margin-bottom: 30px;
            background: rgba(10, 14, 39, 0.6);
            border: 1px solid rgba(0, 245, 255, 0.2);
            border-radius: 15px;
            padding: 25px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.05);
            position: relative;
            overflow: hidden;
        }

        .section::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #00f5ff, transparent);
            animation: scan 3s linear infinite;
        }

        @keyframes scan {
            0% { left: -100%; }
            100% { left: 100%; }
        }

        .section-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 24px;
            font-weight: 700;
            color: #00f5ff;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 3px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .section-title::before {
            content: '';
            width: 4px;
            height: 24px;
            background: linear-gradient(180deg, #00f5ff, transparent);
            box-shadow: 0 0 10px #00f5ff;
        }

        .image-reward-row {
            display: flex;
            flex-wrap: wrap;
            gap: 25px;
        }

        .render-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            flex: 1;
            min-width: 60%;
        }

        .render-item {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(0, 245, 255, 0.3);
            border-radius: 12px;
            padding: 15px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .render-item::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(from 0deg, transparent, rgba(0, 245, 255, 0.1), transparent 30%);
            animation: rotate 4s linear infinite;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .render-item:hover::before {
            opacity: 1;
        }

        @keyframes rotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .render-item:hover {
            transform: translateY(-5px);
            border-color: #00f5ff;
            box-shadow: 0 10px 30px rgba(0, 245, 255, 0.3);
        }

        .render-image {
            width: 100%;
            height: auto;
            max-height: 300px;
            object-fit: contain;
            border-radius: 8px;
            position: relative;
            z-index: 1;
            border: 1px solid rgba(0, 245, 255, 0.2);
        }

        .render-key {
            margin-top: 12px;
            font-weight: 600;
            color: #00f5ff;
            text-align: center;
            font-size: 16px;
            letter-spacing: 1px;
            position: relative;
            z-index: 1;
        }

        .save-button {
            margin-top: 12px;
            padding: 8px 20px;
            background: linear-gradient(135deg, rgba(0, 245, 255, 0.2), rgba(0, 212, 255, 0.2));
            color: #00f5ff;
            border: 1px solid #00f5ff;
            border-radius: 6px;
            cursor: pointer;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 600;
            font-size: 14px;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            width: 100%;
            text-transform: uppercase;
            position: relative;
            z-index: 1;
        }

        .save-button:hover {
            background: linear-gradient(135deg, #00f5ff, #00d4ff);
            color: #0a0e27;
            box-shadow: 0 5px 20px rgba(0, 245, 255, 0.4);
            transform: translateY(-2px);
        }

        .reward-plot-container {
            flex: 1;
            min-width: 35%;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(0, 245, 255, 0.3);
            border-radius: 12px;
            padding: 20px;
        }

        .plot-grid, .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
        }

        .info-item {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(0, 245, 255, 0.3);
            border-radius: 12px;
            padding: 20px;
            transition: all 0.3s ease;
            position: relative;
            max-height: 300px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .plot-item {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(0, 245, 255, 0.3);
            border-radius: 12px;
            padding: 20px;
            transition: all 0.3s ease;
            position: relative;
        }

        .plot-item:hover, .info-item:hover {
            border-color: #00f5ff;
            box-shadow: 0 5px 20px rgba(0, 245, 255, 0.2);
        }

        .plot-title, .info-key {
            font-family: 'Orbitron', sans-serif;
            font-size: 16px;
            font-weight: 700;
            color: #00f5ff;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .info-value {
            font-size: 32px;
            font-weight: 700;
            color: #ffffff;
            text-shadow: 0 0 10px rgba(0, 245, 255, 0.5);
            word-wrap: break-word;
            overflow-wrap: break-word;
            max-height: 200px;
            overflow-y: auto;
        }

        .info-value::-webkit-scrollbar {
            width: 6px;
        }

        .info-value::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 3px;
        }

        .info-value::-webkit-scrollbar-thumb {
            background: rgba(0, 245, 255, 0.5);
            border-radius: 3px;
        }

        .info-value::-webkit-scrollbar-thumb:hover {
            background: #00f5ff;
        }

        .hide-button {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(255, 0, 100, 0.2);
            border: 1px solid rgba(255, 0, 100, 0.5);
            color: #ff0064;
            font-size: 20px;
            cursor: pointer;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            font-weight: bold;
        }

        .hide-button:hover {
            background: #ff0064;
            color: #0a0e27;
            box-shadow: 0 0 15px rgba(255, 0, 100, 0.6);
            transform: rotate(90deg);
        }

        .error-message {
            background: rgba(255, 0, 100, 0.1);
            border: 1px solid #ff0064;
            color: #ff0064;
            padding: 15px;
            margin: 15px 0;
            border-radius: 8px;
            font-weight: 600;
            animation: errorPulse 1s ease-in-out infinite alternate;
        }

        @keyframes errorPulse {
            from { box-shadow: 0 0 10px rgba(255, 0, 100, 0.3); }
            to { box-shadow: 0 0 20px rgba(255, 0, 100, 0.6); }
        }

        .plot-container {
            width: 100%;
            height: 200px;
        }

        canvas {
            filter: drop-shadow(0 0 5px rgba(0, 245, 255, 0.3));
        }

        .sortable-ghost {
            opacity: 0.4;
            background: rgba(0, 245, 255, 0.1);
            border: 2px dashed #00f5ff;
        }

        .sortable-drag {
            opacity: 0.9;
            transform: scale(1.05) rotate(2deg);
            box-shadow: 0 10px 40px rgba(0, 245, 255, 0.4);
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 32px;
            }

            .render-grid, .plot-grid, .info-grid {
                grid-template-columns: 1fr;
            }

            .image-reward-row {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>◢ CARDREAMER ◣</h1>
            <div class="status-bar">
                <div class="status-indicator">
                    <div class="status-dot"></div>
                    <span>SYSTEM ONLINE</span>
                </div>
                <div class="status-indicator">
                    <div class="status-dot"></div>
                    <span>STREAMING ACTIVE</span>
                </div>
            </div>
        </div>

        <div class="section">
            <div class="section-title">⟨ OBSERVATIONS ⟩</div>
            <div class="image-reward-row">
                <div class="render-grid" role="grid"></div>
                <div class="reward-plot-container" role="complementary">
                    <canvas aria-label="Reward Plot"></canvas>
                </div>
            </div>
        </div>

        <div class="section">
            <div class="section-title">⟨ SYSTEM INFO ⟩</div>
            <div class="info-grid" role="grid"></div>
        </div>

        <div class="section">
            <div class="section-title">⟨ ANALYTICS ⟩</div>
            <div class="plot-grid" role="grid"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.14.0/Sortable.min.js"></script>
    <script>
        const CONFIG = {
            GRID_SIZES: {
                RENDER: 220,
                PLOT: 350,
                INFO: 200
            },
            MAX_HISTORY: 100,
            CHART_DEFAULTS: {
                tension: 0.4,
                borderWidth: 2,
                pointRadius: 0
            }
        };

        const state = {
            valueHistory: new Map(),
            charts: new Map(),
            isConnected: false
        };

        const elements = {
            renderGrid: document.querySelector('.render-grid'),
            rewardPlotContainer: document.querySelector('.reward-plot-container'),
            plotGrid: document.querySelector('.plot-grid'),
            infoGrid: document.querySelector('.info-grid')
        };

        function saveImage(key, base64Image) {
            const link = document.createElement('a');
            link.href = `data:image/webp;base64,${base64Image}`;
            link.download = `${key}_${Date.now()}.webp`;
            link.click();
        }

        function initializeRewardPlot(rewardData, colorPalette) {
            const ctx = elements.rewardPlotContainer.querySelector('canvas').getContext('2d');
            elements.rewardPlotContainer.chart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: Object.keys(rewardData).map((key, index) => ({
                        label: key,
                        data: [],
                        borderColor: colorPalette[index],
                        backgroundColor: colorPalette[index] + '40',
                        pointRadius: 0,
                        lineTension: 0.4,
                        borderWidth: 2
                    }))
                },
                options: {
                    scales: {
                        x: {
                            display: false,
                            grid: { color: 'rgba(0, 245, 255, 0.1)' }
                        },
                        y: {
                            display: true,
                            grid: { color: 'rgba(0, 245, 255, 0.1)' },
                            ticks: {
                                color: '#00f5ff',
                                callback: value => value.toFixed(2)
                            }
                        }
                    },
                    plugins: {
                        legend: {
                            display: true,
                            position: 'bottom',
                            labels: {
                                color: '#00f5ff',
                                boxWidth: 12,
                                boxHeight: 12,
                                font: { size: 12, family: 'Rajdhani' },
                                padding: 15,
                                usePointStyle: true
                            }
                        }
                    },
                    aspectRatio: 2,
                    animation: false,
                    responsive: true,
                    maintainAspectRatio: false
                }
            });
        }

        const createChartConfig = (key, data) => ({
            type: 'line',
            data: {
                labels: data.map((_, i) => i),
                datasets: [{
                    label: key,
                    data: data,
                    borderColor: '#00f5ff',
                    backgroundColor: 'rgba(0, 245, 255, 0.1)',
                    ...CONFIG.CHART_DEFAULTS
                }]
            },
            options: {
                scales: {
                    x: {
                        display: false,
                        grid: { color: 'rgba(0, 245, 255, 0.1)' }
                    },
                    y: {
                        display: true,
                        grid: { color: 'rgba(0, 245, 255, 0.1)' },
                        ticks: {
                            color: '#00f5ff',
                            callback: value => value.toFixed(2)
                        }
                    }
                },
                plugins: {
                    legend: { display: false },
                    tooltip: { enabled: false }
                },
                animation: false,
                responsive: true,
                maintainAspectRatio: false
            }
        });

        function updateExistingRewardPlot(rewardData) {
            const chart = elements.rewardPlotContainer.chart;
            chart.data.labels.push(chart.data.labels.length);
            Object.entries(rewardData).forEach(([key, value], index) => {
                chart.data.datasets[index].data.push(value);
            });
            if (chart.data.labels.length > CONFIG.MAX_HISTORY) {
                chart.data.labels.shift();
                chart.data.datasets.forEach(dataset => {
                    dataset.data.shift();
                });
            }
            chart.update();
        }

        function updatePlot(key, value, ctx) {
            if (!state.valueHistory.has(key)) {
                state.valueHistory.set(key, []);
            }
            const history = state.valueHistory.get(key);
            history.push(value);
            if (history.length > CONFIG.MAX_HISTORY) {
                history.shift();
            }

            if (!ctx.chart) {
                ctx.chart = new Chart(ctx, createChartConfig(key, history));
            } else {
                ctx.chart.data.labels.push(ctx.chart.data.labels.length);
                ctx.chart.data.datasets[0].data = history;
                ctx.chart.update();
            }
        }

        function updatePlotGrid(info) {
            Object.entries(info).forEach(([key, value]) => {
                if (typeof value === 'number') {
                    let plotItem = elements.plotGrid.querySelector(`[data-key="${key}"]`);
                    if (!plotItem) {
                        plotItem = document.createElement('div');
                        plotItem.className = 'plot-item';
                        plotItem.setAttribute('data-key', key);
                        plotItem.innerHTML = `
                            <div class="plot-title">${key}</div>
                            <div class="plot-container">
                                <canvas></canvas>
                            </div>
                            <button class="hide-button" data-key="${key}">&times;</button>
                        `;
                        elements.plotGrid.appendChild(plotItem);
                        plotItem.querySelector('.hide-button').addEventListener('click', () => {
                            plotItem.style.display = plotItem.style.display === 'none' ? 'block' : 'none';
                        });
                    }
                    updatePlot(key, value, plotItem.querySelector('.plot-container canvas').getContext('2d'));
                }
            });
        }

        function updateInfoGrid(info) {
            Object.entries(info).forEach(([key, value]) => {
                if (typeof value !== 'number') {
                    let infoItem = elements.infoGrid.querySelector(`[data-key="${key}"]`);
                    if (!infoItem) {
                        infoItem = document.createElement('div');
                        infoItem.className = 'info-item';
                        infoItem.setAttribute('data-key', key);
                        infoItem.innerHTML = `
                            <div class="info-key">${key}</div>
                            <div class="info-value"></div>
                            <button class="hide-button" data-key="${key}">&times;</button>
                        `;
                        elements.infoGrid.appendChild(infoItem);
                        infoItem.querySelector('.hide-button').addEventListener('click', () => {
                            infoItem.style.display = infoItem.style.display === 'none' ? 'flex' : 'none';
                        });
                    }
                    infoItem.querySelector('.info-value').textContent = value;
                }
            });
        }

        const updateRewardPlot = (info) => {
            const rewardData = Object.entries(info)
                .filter(([key]) => key.startsWith('r_'))
                .reduce((acc, [key, value]) => ({ ...acc, [key]: value }), {});

            const colorPalette = generateColorPalette(Object.keys(rewardData).length);

            if (!elements.rewardPlotContainer.chart) {
                initializeRewardPlot(rewardData, colorPalette);
            } else {
                updateExistingRewardPlot(rewardData);
            }
        };

        function generateColorPalette(numColors) {
            const colors = [];
            const baseColors = ['#00f5ff', '#ff0064', '#00ff88', '#ffaa00', '#ff00ff', '#00ffff'];
            for (let i = 0; i < numColors; i++) {
                colors.push(baseColors[i % baseColors.length]);
            }
            return colors;
        }

        const debounce = (fn, delay) => {
            let timeoutId;
            return (...args) => {
                clearTimeout(timeoutId);
                timeoutId = setTimeout(() => fn.apply(null, args), delay);
            };
        };

        const updateAllDisplays = (data) => {
            if (data.images) updateRenderGrid(data.images);
            if (data.info) {
                updateRewardPlot(data.info);
                updatePlotGrid(data.info);
                updateInfoGrid(data.info);
            }
        };

        const handleError = (error, context) => {
            console.error(`Error in ${context}:`, error);
            const container = document.querySelector('.container');
            const errorDiv = document.createElement('div');
            errorDiv.className = 'error-message';
            errorDiv.textContent = `⚠ ERROR: ${error.message}`;
            container.prepend(errorDiv);
            setTimeout(() => errorDiv.remove(), 5000);
        };

        const setupEventSource = () => {
            const eventSource = new EventSource('/stream');

            eventSource.onopen = () => {
                state.isConnected = true;
                console.log('Connected to event stream');
            };

            eventSource.onmessage = event => {
                try {
                    const data = JSON.parse(event.data);
                    updateAllDisplays(data);
                } catch (error) {
                    handleError(error, 'Processing event data');
                }
            };

            eventSource.onerror = error => {
                state.isConnected = false;
                handleError(error, 'EventSource connection');
                setTimeout(() => {
                    if (!state.isConnected) {
                        setupEventSource();
                    }
                }, 5000);
            };

            return eventSource;
        };

        function updateRenderGrid(images) {
            if (!Array.isArray(images)) return;

            const existingKeys = new Set(
                Array.from(elements.renderGrid.children).map(
                    item => item.querySelector('.render-key').textContent
                )
            );

            images.forEach(item => {
                if (!item.image || !item.key) return;

                let renderItem = elements.renderGrid.querySelector(
                    `.render-item[data-key="${item.key}"]`
                );

                if (!renderItem) {
                    renderItem = document.createElement('div');
                    renderItem.className = 'render-item';
                    renderItem.setAttribute('data-key', item.key);
                    renderItem.innerHTML = `
                    <img class="render-image" alt="${item.key}" loading="lazy">
                    <div class="render-key">${item.key}</div>
                    <button class="save-button" aria-label="Save ${item.key}">▼ SAVE</button>
                `;

                    renderItem.querySelector('.save-button').addEventListener('click', () => {
                        saveImage(item.key, item.image);
                    });

                    elements.renderGrid.appendChild(renderItem);
                }

                const img = renderItem.querySelector('.render-image');
                const newSrc = `data:image/webp;base64,${item.image}`;
                if (img.src !== newSrc) {
                    img.src = newSrc;
                }

                existingKeys.delete(item.key);
            });

            existingKeys.forEach(key => {
                const obsoleteItem = elements.renderGrid.querySelector(
                    `.render-item[data-key="${key}"]`
                );
                if (obsoleteItem) {
                    obsoleteItem.remove();
                }
            });
        }

        const initializeSortable = () => {
            Sortable.create(elements.plotGrid, {
                animation: 150,
                ghostClass: 'sortable-ghost',
                dragClass: 'sortable-drag',
                group: 'plots',
                onEnd: () => adjustGridColumns()
            });

            Sortable.create(elements.infoGrid, {
                animation: 150,
                ghostClass: 'sortable-ghost',
                dragClass: 'sortable-drag',
                group: 'info',
                onEnd: () => adjustGridColumns()
            });
        };

        const adjustGridColumns = debounce(() => {
            const calculateColumns = (element, minWidth, maxColumns = Infinity) => {
                const containerWidth = element.clientWidth;
                return Math.min(
                    Math.max(Math.floor(containerWidth / minWidth), 1),
                    maxColumns
                );
            };

            const grids = {
                render: { element: elements.renderGrid, size: CONFIG.GRID_SIZES.RENDER, maxColumns: 3 },
                plot: { element: elements.plotGrid, size: CONFIG.GRID_SIZES.PLOT },
                info: { element: elements.infoGrid, size: CONFIG.GRID_SIZES.INFO }
            };

            Object.entries(grids).forEach(([_, { element, size, maxColumns }]) => {
                if (element) {
                    const columns = calculateColumns(element, size, maxColumns);
                    element.style.gridTemplateColumns = `repeat(${columns}, 1fr)`;
                }
            });
        }, 100);

        const init = () => {
            setupEventSource();
            initializeSortable();
            window.addEventListener('resize', adjustGridColumns);
            adjustGridColumns();
        };

        init();

        window.addEventListener('beforeunload', () => {
            state.charts.forEach(chart => chart.destroy());
        });
    </script>
</body>

</html>
